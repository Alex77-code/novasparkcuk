<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Owner Login</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12365a,#07111f 65%)}main{width:min(440px,92vw)}.card{background:#0b2035;border:1px solid #294965;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0005}.input{width:100%;padding:13px;margin:7px 0 12px;background:#07111f;color:#fff;border:1px solid #294965;border-radius:11px}.btn{width:100%;padding:13px;border:1px solid #3b6b92;background:#123a5d;color:#fff;border-radius:11px;cursor:pointer}.muted{color:#91a4bb;font-size:14px}.error{color:#ff9b9b}</style></head><body><main><div class="card"><h1>⚡ NovaSpark</h1><h2>Owner Login</h2><p class="muted">Authorized owner access only.</p><label>Email</label><input id="email" class="input" type="email" autocomplete="username" value="novasparkcreative@gmail.com" readonly><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Your password"><button class="btn" onclick="login()">Secure Login</button><p id="status" class="error"></p><p class="muted">Your password is sent directly to the authentication provider and is never stored in this page or GitHub.</p></div></main><script>async function login(){const email=document.getElementById('email').value,password=document.getElementById('password').value,status=document.getElementById('status');if(!password)return status.textContent='Password is required.';status.textContent='Signing in securely…';try{const c=await fetch('/.netlify/functions/auth-config');const cfg=await c.json();if(!c.ok)throw new Error(cfg.error||'Auth configuration unavailable');const s=await import('https://esm.sh/@supabase/supabase-js@2');const supabase=s.createClient(cfg.url,cfg.anonKey);const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error||!data.session)throw new Error(error?.message||'Login failed');const g=await fetch('/.netlify/functions/owner-auth-gate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({})});const gate=await g.json();if(!g.ok||!gate.authorized){await supabase.auth.signOut();throw new Error(gate.error||'Owner access denied')}sessionStorage.setItem('novaspark_access_token',data.session.access_token);sessionStorage.setItem('novaspark_org_id',gate.organization_id);location.href='/command-center.html';}catch(e){status.textContent=e.message||'Login failed.'}}</script></body></html>
