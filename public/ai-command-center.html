<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark AI Command Center</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102c4d,#07111f 55%);min-height:100vh}.wrap{max-width:1280px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{font-size:24px;font-weight:800}.muted{color:#91a4bb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:rgba(12,28,47,.88);border:1px solid #23405d;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0004}.label{font-size:13px;color:#91a4bb}.value{font-size:32px;font-weight:800;margin-top:8px}.modules{margin-top:22px}.modules .card{min-height:100px}.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:#173b31;color:#8ff0c3;font-size:12px}.danger{background:#4b2227;color:#ffb0b7}.section{margin-top:30px;margin-bottom:12px;font-size:18px;font-weight:700}</style></head>
<body><main class="wrap"><div class="top"><div><div class="brand">⚡ NovaSpark AI Command Center</div><div class="muted">CEO operating dashboard</div></div><span id="status" class="status">LIVE DATA</span></div><div class="grid" id="kpis"></div><div class="section">AI Operating Modules</div><div class="grid modules" id="modules"></div></main><script>
const params=new URLSearchParams(location.search),org=params.get('organization_id');
const fmt=n=>new Intl.NumberFormat('en-GB').format(n||0);
async function load(){if(!org){document.querySelector('#status').textContent='ORGANIZATION REQUIRED';document.querySelector('#status').className='status danger';return}try{const r=await fetch('/.netlify/functions/ai-command-center-dashboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id:org})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Dashboard failed');const k=d.dashboard.kpis;document.querySelector('#status').textContent=k.emergency_stop?'EMERGENCY STOP':'SYSTEM READY';document.querySelector('#status').className='status'+(k.emergency_stop?' danger':'');const cards=[['Active Clients',k.clients.active],['Total Projects',k.projects.total],['In Progress',k.projects.in_progress],['Tasks',k.tasks.total],['Completed Tasks',k.tasks.completed],['Overdue Tasks',k.tasks.overdue],['Invoiced',`£${fmt(k.finance.invoiced_total)}`],['Payments Received',`£${fmt(k.finance.payments_received)}`]];document.querySelector('#kpis').innerHTML=cards.map(([a,b])=>`<div class="card"><div class="label">${a}</div><div class="value">${b}</div></div>`).join('');document.querySelector('#modules').innerHTML=d.dashboard.modules.map(x=>`<div class="card"><div class="value" style="font-size:20px">${x}</div><div class="muted">Connected to command center</div></div>`).join('')}catch(e){document.querySelector('#status').textContent='LOAD ERROR';document.querySelector('#status').className='status danger';console.error(e)}}load();
</script></body></html>
