<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Voice CEO</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12365a,#07111f 60%)}main{max-width:700px;margin:auto;padding:24px}.card{background:#0b2035;border:1px solid #294965;border-radius:20px;padding:20px;margin:14px 0}.input{width:100%;padding:13px;background:#07111f;color:#fff;border:1px solid #294965;border-radius:12px;margin-top:8px}.btn{width:100%;padding:16px;margin-top:12px;border-radius:14px;border:1px solid #3b6b92;background:#123a5d;color:#fff;font-size:16px;cursor:pointer}.mic{font-size:56px;text-align:center;padding:18px}.msg{white-space:pre-wrap;line-height:1.6}.muted{color:#91a4bb}</style></head><body><main><h1>🎙️ NovaSpark AI CEO</h1><p class="muted">Speak to your business operating system from your phone.</p><div class="card"><label>Organization ID</label><input id="org" class="input" placeholder="Organization ID"><div class="mic">🎙️</div><button id="talk" class="btn" onclick="listen()">Start Voice Command</button><div id="heard" class="muted" style="margin-top:12px">Ready.</div></div><div class="card"><h2>🤖 CEO Response</h2><div id="out" class="msg">No command yet.</div></div></main><script>const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}async function ask(message){const org=document.getElementById('org').value.trim();if(!org)return alert('Organization ID required');document.getElementById('out').textContent='Thinking…';try{const r=await fetch('/.netlify/functions/ai-ceo-openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id:org,message})});const d=await r.json();const answer=d.answer||d.error||'No response';document.getElementById('out').textContent=answer;speak(answer)}catch(e){document.getElementById('out').textContent='Unable to contact AI CEO.'}}function listen(){if(!SpeechRecognition){alert('Voice recognition is not supported by this browser. You can use the text AI CEO interface instead.');return}const r=new SpeechRecognition();r.lang='en-IN';r.interimResults=false;r.maxAlternatives=1;document.getElementById('talk').textContent='Listening…';r.onresult=e=>{const text=e.results[0][0].transcript;document.getElementById('heard').textContent='Heard: '+text;ask(text)};r.onerror=e=>document.getElementById('heard').textContent='Voice error: '+e.error;r.onend=()=>document.getElementById('talk').textContent='Start Voice Command';r.start()}</script></body></html>
