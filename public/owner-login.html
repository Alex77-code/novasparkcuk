<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Owner Login</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12365a,#07111f 65%)}main{width:min(440px,92vw)}.card{background:#0b2035;border:1px solid #294965;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0005}.input{width:100%;padding:13px;margin:7px 0 12px;background:#07111f;color:#fff;border:1px solid #294965;border-radius:11px}.btn{width:100%;padding:13px;border:1px solid #3b6b92;background:#123a5d;color:#fff;border-radius:11px;cursor:pointer}.muted{color:#91a4bb;font-size:14px}.error{color:#ff9b9b}</style></head><body><main><div class="card"><h1>⚡ NovaSpark</h1><h2>Owner Login</h2><p class="muted">Authorized owner access only.</p><label>Owner Email</label><input id="email" class="input" type="email" autocomplete="username" value="novasparkcreative@gmail.com" readonly><label>Organization ID</label><input id="org" class="input" placeholder="Organization ID" autocomplete="organization"><p class="muted">Authentication is verified server-side. Your password must be handled by the configured authentication provider and is never stored in this page.</p><button class="btn" onclick="verify()">Continue Securely</button><p id="status" class="error"></p></div></main><script>async function verify(){const org=document.getElementById('org').value.trim();if(!org)return document.getElementById('status').textContent='Organization ID is required.';document.getElementById('status').textContent='Authentication provider integration required.';}</script></body></html>
