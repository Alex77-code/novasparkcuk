<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Audit Log</title><script src="/auth-guard.js"></script><style>body{margin:0;background:#07111f;color:#eaf2ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#0b2035;border:1px solid #294965;border-radius:18px;padding:18px;margin:14px 0}.row{padding:14px 0;border-bottom:1px solid #203a52}.muted{color:#91a4bb}.event{font-weight:700}.meta{font-size:13px;color:#91a4bb;margin-top:5px}button{padding:10px 14px;border-radius:10px;border:1px solid #315a7b;background:#123a5d;color:#fff}</style></head><body><main class="wrap"><h1>📊 NovaSpark Audit Log</h1><p class="muted">Owner-only security and business activity trail.</p><div class="card"><button onclick="load()">Refresh</button><span id="status" class="muted"></span></div><section id="events" class="card">Loading…</section></main><script>NovaAuthGuard.guard();async function load(){const token=sessionStorage.getItem('novaspark_access_token')||localStorage.getItem('nova_access_token');const org=sessionStorage.getItem('novaspark_org_id')||localStorage.getItem('nova_org_id');const box=document.getElementById('events');if(!token||!org)return;try{const r=await fetch('/.netlify/functions/audit-log',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({organization_id:org,limit:100})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load audit log');const rows=d.events||[];box.innerHTML=rows.length?rows.map(e=>`<div class="row"><div class="event">${esc(e.event_type||'EVENT')}</div><div class="meta">${esc(e.created_at||'')} · ${esc(e.user_id||'')}</div><div>${esc(JSON.stringify(e.payload||{}))}</div></div>`).join(''):'No audit events yet.';document.getElementById('status').textContent=' '+rows.length+' events';}catch(e){box.textContent=e.message}}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}load();</script></body></html>
