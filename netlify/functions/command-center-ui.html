<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Command Center</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#08111f;color:#eef5ff}main{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:22px}.card{background:#101d31;border:1px solid #233552;border-radius:16px;padding:18px}.value{font-size:28px;font-weight:800;margin-top:8px}.status{padding:8px 12px;border-radius:999px;background:#183653}.danger{background:#5a2028}.muted{color:#9fb0c8}button{background:#1d6fff;color:white;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word}.wide{grid-column:1/-1}</style></head><body><main><div class="top"><div><h1>NovaSpark AI Command Center</h1><div class="muted">CEO • Revenue • Sales • Delivery • Agents</div></div><button onclick="load()">Refresh</button></div><div id="state" class="card" style="margin-top:18px">Loading...</div><div id="metrics" class="grid"></div><div class="grid"><div class="card wide"><h2>CEO Goals</h2><pre id="goals">Loading...</pre></div><div class="card wide"><h2>Agent Load</h2><pre id="agents">Loading...</pre></div></div></main><script>async function load(){const el=document.getElementById('state');try{const r=await fetch('/.netlify/functions/command-center-summary');if(!r.ok)throw new Error('Dashboard API returned '+r.status);const d=await r.json();el.innerHTML='<b>System:</b> '+(d.emergency_stop?'<span class="status danger">EMERGENCY STOP ACTIVE</span>':'<span class="status">Operational</span>');const m=d.metrics||{};document.getElementById('metrics').innerHTML=Object.entries(m).map(([k,v])=>'<div class="card"><div class="muted">'+k.replaceAll('_',' ')+'</div><div class="value">'+v+'</div></div>').join('');document.getElementById('goals').textContent=JSON.stringify(d.goals||[],null,2);document.getElementById('agents').textContent=JSON.stringify(d.agent_load||{},null,2)}catch(e){el.innerHTML='<span class="status danger">Dashboard unavailable</span><p>'+e.message+'</p>'}}load();setInterval(load,60000)</script></body></html>
