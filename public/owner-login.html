<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Owner Access</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12365a,#07111f 65%)}main{width:min(460px,92vw)}.card{background:#0b2035;border:1px solid #294965;border-radius:20px;padding:25px;box-shadow:0 20px 60px #0005}.input{width:100%;padding:13px;margin:7px 0 12px;background:#07111f;color:#fff;border:1px solid #294965;border-radius:11px;box-sizing:border-box}.btn{width:100%;padding:13px;border:1px solid #3b6b92;background:#123a5d;color:#fff;border-radius:11px;cursor:pointer}.muted{color:#91a4bb;font-size:14px}.error{color:#ff9b9b}.success{color:#7ee2a8}.small{font-size:12px}</style></head><body><main><div class="card"><h1>⚡ NovaSpark</h1><h2>Owner Access</h2><p class="muted">Secure owner account for the NovaSpark AI Business Operating System.</p><label>Email</label><input id="email" class="input" type="email" autocomplete="username" value="novasparkcreative@gmail.com"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Create or enter your password"><label>Organization ID</label><input id="org" class="input" autocomplete="organization" value="7199c975-b5c7-4aaa-a7e9-20960b18c058"><div style="display:grid;gap:10px"><button class="btn" onclick="login()">Secure Login</button><button class="btn" onclick="signup()">Create Owner Account</button></div><p id="status" class="error"></p><p class="muted small">Authentication is handled by Supabase. Passwords are never stored in this page or GitHub.</p></div></main><script>async function client(){const c=await fetch('/.netlify/functions/auth-config');const cfg=await c.json();if(!c.ok)throw new Error(cfg.error||'Auth configuration unavailable');const s=await import('https://esm.sh/@supabase/supabase-js@2');return s.createClient(cfg.url,cfg.anonKey)}async function signup(){const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,status=document.getElementById('status');if(email!=='novasparkcreative@gmail.com')return status.textContent='Use the configured owner email.';if(password.length<8)return status.textContent='Use a password with at least 8 characters.';status.className='success';status.textContent='Creating secure owner account…';try{const supabase=await client();const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(!data.session){status.textContent='Account created. Check your email to confirm the account, then log in.';return}await finish(supabase,data.session,status)}catch(e){status.className='error';status.textContent=e.message||'Signup failed'}}async function login(){const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,status=document.getElementById('status');if(email!=='novasparkcreative@gmail.com')return status.textContent='This account is not authorized.';if(!password)return status.textContent='Password is required.';status.className='success';status.textContent='Signing in securely…';try{const supabase=await client();const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error||!data.session)throw error||new Error('Login failed');await finish(supabase,data.session,status)}catch(e){status.className='error';status.textContent=e.message||'Login failed'}}async function finish(supabase,session,status){const org=document.getElementById('org').value.trim();const g=await fetch('/.netlify/functions/owner-auth-gate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({organization_id:org})});const gate=await g.json();if(!g.ok||!gate.authorized){await supabase.auth.signOut();throw new Error(gate.error||'Owner access denied');}localStorage.setItem('nova_access_token',session.access_token);localStorage.setItem('nova_org_id',gate.organization_id);location.href='/command-center.html'}</script></body></html>
