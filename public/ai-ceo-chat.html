<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark AI CEO Chat</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;background:radial-gradient(circle at top,#12365a,#07111f 60%);min-height:100vh}main{max-width:900px;margin:auto;padding:24px}.card{background:#0b2035;border:1px solid #294965;border-radius:18px;padding:20px;margin:14px 0}.msg{white-space:pre-wrap;line-height:1.6}.input{width:100%;padding:14px;background:#07111f;color:#fff;border:1px solid #294965;border-radius:12px}.row{display:flex;gap:10px;margin-top:10px}.btn{padding:12px 16px;border-radius:11px;border:1px solid #3b6b92;background:#123a5d;color:#fff;cursor:pointer}.muted{color:#91a4bb}</style></head><body><main><h1>🤖 NovaSpark AI CEO</h1><p class="muted">Ask the business operating system what is happening and what should happen next.</p><div class="card"><input id="org" class="input" placeholder="Organization ID"><textarea id="message" class="input" rows="4" style="margin-top:10px" placeholder="e.g. Check my company status and tell me what I should do first today."></textarea><div class="row"><button class="btn" onclick="send()">Ask AI CEO</button><a class="btn" href="/command-center.html">Command Center</a></div></div><div class="card"><h2>CEO Response</h2><div id="out" class="msg">Ready.</div></div></main><script>async function send(){const organization_id=document.getElementById('org').value.trim(),message=document.getElementById('message').value.trim();if(!organization_id||!message)return alert('Organization ID and message are required');document.getElementById('out').textContent='Thinking…';try{const r=await fetch('/.netlify/functions/ai-ceo-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id,message})});const d=await r.json();document.getElementById('out').textContent=d.answer||d.error||'No response'}catch(e){document.getElementById('out').textContent='Unable to contact AI CEO.'}}</script></body></html>
