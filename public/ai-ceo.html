<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark AI CEO</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12365a,#07111f 60%)}main{max-width:1000px;margin:auto;padding:28px}.card{background:#0b2035;border:1px solid #294965;border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #3b6b92;background:#123a5d;color:#eaf6ff;border-radius:11px;padding:11px 15px;cursor:pointer}.muted{color:#91a4bb}.item{padding:12px;border-bottom:1px solid #203c55}.warn{color:#ffd27a}.ok{color:#7ee2a8}</style></head><body><main><h1>🤖 NovaSpark AI CEO</h1><p class="muted">Central business intelligence and orchestration.</p><div class="card"><label>Organization ID</label><input id="org" style="display:block;width:100%;margin:8px 0;padding:12px;background:#07111f;color:white;border:1px solid #294965;border-radius:10px" placeholder="Enter organization ID"><div class="row"><button class="btn" onclick="call('STATUS')">View Status</button><button class="btn" onclick="call('PLAN')">Generate Plan</button><button class="btn" onclick="executePlan()">Approve & Create Tasks</button></div></div><div class="card"><h2>CEO Output</h2><pre id="out" style="white-space:pre-wrap;overflow:auto">No command run yet.</pre></div></main><script>let plan=null;async function call(action,approval=false){const organization_id=document.getElementById('org').value.trim();if(!organization_id)return alert('Organization ID required');const r=await fetch('/.netlify/functions/ai-ceo-orchestrator',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id,action,approval})});const d=await r.json();plan=d.plan||d.ceo_plan||null;document.getElementById('out').textContent=JSON.stringify(d,null,2)}async function executePlan(){if(!confirm('Approve this AI CEO plan and create internal tasks?'))return;await call('EXECUTE',true)}</script></body></html>
