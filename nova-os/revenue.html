<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Revenue Engine</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="brand"><span class="dot"></span>NOVA REVENUE</div><a class="ghost" href="/nova-os/">← CEO</a></header><main class="main" style="margin-left:0"><section class="hero"><div><p class="eyebrow">PHASE 2 · REVENUE ENGINE</p><h1>Prospects → Leads → Deals → Revenue</h1><p>Real CRM state only. No invented prospects, pipeline or revenue.</p></div></section><section class="grid metrics"><article><span>Companies</span><strong id="companies">—</strong></article><article><span>Leads</span><strong id="leads">—</strong></article><article><span>Qualified</span><strong id="qualified">—</strong></article><article><span>Meetings</span><strong id="meetings">—</strong></article><article><span>Pipeline</span><strong id="pipeline">—</strong></article><article><span>Weighted Pipeline</span><strong id="weighted">—</strong></article></section><section class="grid two"><article class="card" style="padding:22px"><div class="section-head"><h2>Prospect</h2></div><form id="prospect"><input name="name" placeholder="Company name" required><input name="domain" placeholder="Domain"><input name="industry" placeholder="Industry"><input name="location" placeholder="Location"><button>Add real prospect</button></form></article><article class="card" style="padding:22px"><div class="section-head"><h2>Opportunity</h2></div><form id="opp"><input name="name" placeholder="Opportunity name" required><input name="amount" type="number" step="0.01" placeholder="Amount GBP"><input name="service" placeholder="Service"><select name="stage"><option>NEW</option><option>QUALIFIED</option><option>CONTACTED</option><option>MEETING</option><option>PROPOSAL</option><option>NEGOTIATION</option></select><button>Create opportunity</button></form></article></section><section class="card" style="padding:22px"><div class="section-head"><h2>Pipeline</h2><span id="status" class="pill">LOADING</span></div><div id="table" class="list"></div></section></main><script>const token=localStorage.getItem('nova_access_token');const esc=x=>String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const r=await fetch('/.netlify/functions/revenue?type=dashboard',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){document.getElementById('status').textContent=d.error||'ERROR';return}document.getElementById('status').textContent='REAL DATA';for(const [id,key] of [['companies','companies'],['leads','leads'],['qualified','qualifiedLeads'],['meetings','meetings']])document.getElementById(id).textContent=d.metrics[key];document.getElementById('pipeline').textContent='£'+Number(d.metrics.pipeline).toLocaleString();document.getElementById('weighted').textContent='£'+Number(d.metrics.weightedPipeline).toLocaleString();document.getElementById('table').innerHTML=d.opportunities.length?d.opportunities.map(x=>`<div class="agent"><strong>${esc(x.name)} · ${esc(x.stage)}</strong><small>£${Number(x.amount||0).toLocaleString()} · ${Number(x.probability||0)}% · ${esc(x.service||'Service TBD')}</small></div>`).join(''):'<div class="empty">No real opportunities yet.</div>'}async function post(url,data){const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok){const d=await r.json();alert(d.message||d.error||'Request failed');return}await load()}document.getElementById('prospect').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);post('/.netlify/functions/prospect',Object.fromEntries(f))};document.getElementById('opp').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);post('/.netlify/functions/opportunity',Object.fromEntries(f))};load();</script></body></html>
