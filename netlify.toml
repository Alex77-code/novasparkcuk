[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Production autonomous control plane. Netlify Scheduled Functions run in UTC.
# NovaSpark AI-BOS production deployment trigger.
[functions.autonomous-loop]
  schedule = "*/15 * * * *"

[functions.nova-worker]
  schedule = "7,22,37,52 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/command-center"
  to = "/ai-command-center.html"
  status = 200
