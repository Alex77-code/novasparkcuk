<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Client Dashboard</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:1100px;margin:auto;padding:32px}.hero{background:#111827;color:white;border-radius:24px;padding:28px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:20px}.value{font-size:32px;font-weight:800;margin-top:8px}.muted{color:#6b7280}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#2563eb;width:0}.reports{margin-top:22px}.report{padding:14px 0;border-bottom:1px solid #e5e7eb}@media(max-width:600px){.wrap{padding:18px}.hero{border-radius:18px}}</style></head><body><main class="wrap"><section class="hero"><h1>NovaSpark Client Portal</h1><p class="muted" style="color:#d1d5db">Project performance, delivery progress and reports.</p></section><section class="grid"><div class="card"><span class="muted">Tasks</span><div id="tasks" class="value">—</div></div><div class="card"><span class="muted">Completed</span><div id="completed" class="value">—</div></div><div class="card"><span class="muted">QA Approved</span><div id="qa" class="value">—</div></div><div class="card"><span class="muted">Completion</span><div id="rate" class="value">—</div><div class="bar"><div id="fill" class="fill"></div></div></div></section><section class="card reports"><h2>Recent Reports</h2><div id="reports" class="muted">Loading…</div></section></main><script>async function load(){const p=new URLSearchParams(location.search),organization_id=p.get('organization_id'),project_id=p.get('project_id'),token=p.get('token');if(!organization_id||!project_id||!token){document.getElementById('reports').textContent='Secure project credentials are required.';return}try{const r=await fetch('/.netlify/functions/client-dashboard-api',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({organization_id,project_id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Dashboard unavailable');document.getElementById('tasks').textContent=d.summary.tasks_total;document.getElementById('completed').textContent=d.summary.completed;document.getElementById('qa').textContent=d.summary.qa_approved;document.getElementById('rate').textContent=d.summary.completion_rate+'%';document.getElementById('fill').style.width=d.summary.completion_rate+'%';document.getElementById('reports').innerHTML=(d.reports||[]).map(x=>`<div class="report"><strong>${x.status||'REPORT'}</strong><div class="muted">${x.created_at||''}</div></div>`).join('')||'No reports yet.'}catch(e){document.getElementById('reports').textContent=e.message}}load();</script></body></html>
