name: NOVA CEO Autopilot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger NOVA CEO execution loop
        env:
          NOVA_AUTOPILOT_URL: ${{ secrets.NOVA_AUTOPILOT_URL }}
          NOVA_AUTOPILOT_SECRET: ${{ secrets.NOVA_AUTOPILOT_SECRET }}
        run: |
          set -euo pipefail
          test -n "$NOVA_AUTOPILOT_URL"
          if [ -n "${NOVA_AUTOPILOT_SECRET:-}" ]; then
            curl --fail-with-body --retry 2 -X POST "$NOVA_AUTOPILOT_URL" \
              -H 'content-type: application/json' \
              -H "authorization: Bearer $NOVA_AUTOPILOT_SECRET" \
              -d '{"trigger":"github_schedule"}'
          else
            curl --fail-with-body --retry 2 -X POST "$NOVA_AUTOPILOT_URL" \
              -H 'content-type: application/json' \
              -d '{"trigger":"github_schedule"}'
          fi
