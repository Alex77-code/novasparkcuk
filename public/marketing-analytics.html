<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSpark Marketing Analytics</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#07111f;color:#eaf2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#102c4d,#07111f 55%);min-height:100vh}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.brand{font-size:24px;font-weight:800}.muted{color:#91a4bb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:rgba(12,28,47,.9);border:1px solid #23405d;border-radius:18px;padding:20px;box-shadow:0 12px 35px #0004}.label{font-size:13px;color:#91a4bb}.value{font-size:30px;font-weight:800;margin-top:8px}.bar{height:12px;background:#172b40;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:#55b7ff}.section{margin:28px 0 12px;font-size:18px;font-weight:700}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">📊 NovaSpark Marketing Analytics</div><div class="muted">Campaign performance & ROI</div></div><a href="/command-center" style="color:#8fd0ff">Command Center</a></div><div id="kpis" class="grid"></div><div class="section">Channel Spend</div><div id="channels" class="grid"></div></main><script>const org=new URLSearchParams(location.search).get('organization_id');const f=n=>new Intl.NumberFormat('en-GB',{maximumFractionDigits:2}).format(Number(n)||0);async function load(){if(!org){document.body.insertAdjacentHTML('beforeend','<p style="padding:28px">organization_id required</p>');return}const r=await fetch('/.netlify/functions/marketing-analytics-roi-engine',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({organization_id:org})});const d=await r.json();if(!r.ok){document.body.insertAdjacentHTML('beforeend','<p style="padding:28px">Unable to load analytics</p>');return}const a=d.analytics;const cards=[['Campaigns',a.campaigns.total],['Active Campaigns',a.campaigns.active],['Leads',a.leads.total],['Won Leads',a.leads.won],['Conversion Rate',f(a.leads.conversion_rate)+'%'],['Spend','£'+f(a.finance.spend)],['Revenue','£'+f(a.finance.revenue)],['ROI',a.finance.roi_percent===null?'—':f(a.finance.roi_percent)+'%'],['ROAS',a.finance.roas===null?'—':f(a.finance.roas)+'x']];document.getElementById('kpis').innerHTML=cards.map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');const vals=Object.entries(a.by_channel),max=Math.max(1,...vals.map(x=>x[1].budget));document.getElementById('channels').innerHTML=vals.length?vals.map(([ch,v])=>`<div class="card"><div><b>${ch}</b></div><div class="muted">${v.campaigns} campaigns · £${f(v.budget)}</div><div class="bar"><div class="fill" style="width:${v.budget/max*100}%"></div></div></div>`).join(''):'<div class="card">No campaign channel data yet.</div>'}load();</script></body></html>
